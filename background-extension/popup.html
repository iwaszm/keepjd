<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Joybuy Collector</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      button {
        width: 100%;
        height: 34px;
        border: 0;
        border-radius: 6px;
        background: #111827;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 10px;
        margin: 12px 0 0;
      }

      dt,
      dd {
        margin: 0;
      }

      dt {
        color: #6b7280;
      }

      .error {
        margin-top: 10px;
        color: #b91c1c;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Joybuy Collector</h1>
    <div class="actions">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button" disabled>Pause</button>
    </div>
    <dl>
      <dt>Status</dt><dd id="status">Loading</dd>
      <dt>Elapsed</dt><dd id="elapsed">-</dd>
      <dt>Pages</dt><dd id="pages">0</dd>
      <dt>Found</dt><dd id="found">0</dd>
      <dt>Posted</dt><dd id="posted">0</dd>
      <dt>Skipped</dt><dd id="skipped">0</dd>
      <dt>Failed</dt><dd id="failed">0</dd>
      <dt>Target</dt><dd id="target">-</dd>
      <dt>Page</dt><dd id="page">-</dd>
    </dl>
    <div id="error" class="error" hidden></div>
    <script src="popup.js"></script>
  </body>
</html>
